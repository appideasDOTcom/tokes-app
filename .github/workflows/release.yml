name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macos-26 (Xcode 26+) is required: the app icon is an Icon Composer
    # package and only Xcode 26's actool can compile a .icon. On an older
    # image actool fails and build.sh aborts, so releases would not ship.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Info.plist version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)
          [[ "${GITHUB_REF_NAME}" == "v${VERSION}" ]] || {
            echo "Tag ${GITHUB_REF_NAME} does not match Info.plist version v${VERSION}" >&2
            exit 1
          }

      # Both configurations: the App Store build compiles with -DTOKES_APP_STORE,
      # which removes whole functions, so the default configuration alone leaves
      # half the code unbuilt.
      - name: Run tests (both build configurations)
        run: ./scripts/test.sh

      # The compliance gate is a build artifact, so it regresses like one. This
      # catches an out-of-container credential reader creeping back into the
      # App Store build before a submission does.
      - name: Audit the App Store build
        run: |
          ./scripts/build.sh --app-store
          ./scripts/verify-appstore.sh --static-only

      # Ad-hoc signed for now. When Developer ID signing lands, import the
      # cert from repo secrets here and pass --sign/--notarize to release.sh.
      - name: Build release zip
        run: ./scripts/release.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="build/Tokes-${VERSION}.zip"
          SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          gh release create "${GITHUB_REF_NAME}" "$ZIP" \
            --title "Tokes ${GITHUB_REF_NAME}" \
            --notes "Cask sha256: \`${SHA}\`"
